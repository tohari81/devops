- name: Reboot Ubuntu servers
  hosts: ubuntu_servers
  become: true
  gather_facts: true

  tasks:
    - name: Reboot the server
      ansible.builtin.reboot:
        msg: "Server reboot initiated by Ansible"
        reboot_timeout: 600
        connect_timeout: 10
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: uptime
