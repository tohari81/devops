services:
  postgres:
    image: postgres:15
    container_name: semaphore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: semaphore
      POSTGRES_PASSWORD: semaphorepass
      POSTGRES_DB: semaphore
    volumes:
      - postgres_data:/var/lib/postgresql/data

  semaphore:
    image: semaphoreui/semaphore:latest
    container_name: semaphore
    restart: unless-stopped
    ports:
      - "3001:3000"
    depends_on:
      - postgres
    environment:
      SEMAPHORE_DB_DIALECT: postgres
      SEMAPHORE_DB_HOST: postgres
      SEMAPHORE_DB_PORT: 5432
      SEMAPHORE_DB_USER: semaphore
      SEMAPHORE_DB_PASS: semaphorepass
      SEMAPHORE_DB: semaphore

      SEMAPHORE_ADMIN: admin
      SEMAPHORE_ADMIN_PASSWORD: admin2000
      SEMAPHORE_ADMIN_NAME: Administrator
      SEMAPHORE_ADMIN_EMAIL: mendhol@gmail.com

      SEMAPHORE_PLAYBOOK_PATH: /tmp/semaphore/playbooks
    volumes:
      - semaphore_data:/etc/semaphore
      - ./playbooks:/tmp/semaphore/playbooks

volumes:
  postgres_data:
  semaphore_data:
